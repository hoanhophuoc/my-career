# Bộ lọc VĨNH VIỄN các role Hoàn KHÔNG muốn làm (20/11/2026).
#
# Chỉ áp lên CỘT `title` của tin — không xét mô tả, để không xoá oan tin dev
# có chữ "testing"/"support"/"sales" trong kỹ năng.
#
# Định dạng: `tên_nhóm : regex`
#   Nhóm CỨNG (loại ngay): tester/QA, PHP, IT Support/Helpdesk, BrSE, Hardware/embedded
#     — danh sách này khai báo trong purge_excluded_roles.py (HARD_GROUPS).
#   Các nhóm còn lại là MỀM: chỉ loại khi tiêu đề không phải tin dev (xem CHỐT BẢO VỆ DEV).
#
# Muốn loại thêm role: thêm 1 dòng, rồi chạy `python3 _src/purge_excluded_roles.py`.
# Regex chạy với re.I (không phân biệt hoa thường).

# ── CHỐT BẢO VỆ DEV (áp cho nhóm "mềm") ──────────────────────────────────────
# Nếu tiêu đề chứa từ khoá dev VÀ không bắt đầu bằng từ khoá nghề khác
# → GIỮ LẠI, dù có chữ "sales"/"legal"/"ecommerce"/"thiết kế".
# Ví dụ được giữ: "Software Engineer, eCommerce System", "Senior Agentic Software
# Engineer - Sales", "Kỹ sư Thiết kế - Triển khai Hạ tầng CNTT".
# Ví dụ vẫn bị loại: "Sales Engineer", "Graphic Designer".

tester/QA : \btesters?\b|\bsdet\b|\bpentester\b|\bpentest\b|qa/qc|\bqa\b|\bqc\b|test engineer|manual test|automation test|testing engineer|quality[ -]?(assurance|control|engineering|engineer|auditor)|kiểm thử

PHP : \bphp\b|laravel|wordpress|codeigniter|\byii\b|magento|drupal

IT Support/Helpdesk : help[ -]?desk|\bit support\b|support engineer|technical support|desktop support|\bit admin|system admin|sysadmin|\bit operations\b|\bit helpdesk\b|vận hành hệ thống|hỗ trợ kỹ thuật|tư vấn kỹ thuật

BrSE/cầu nối Nhật-Hàn : \bbrse\b|bridge software engineer|bridge engineer|kỹ sư cầu nối|comtor|brse/comtor|phiên dịch (?:it|kỹ thuật)

Hardware/embedded : embedded|\bfirmware\b|hardware|\bfpga\b|\bpcb\b|\biot\b|vi mạch|linh kiện|mạch điện|cơ điện tử

Sales/kinh doanh : \bsales\b(?!force)|sale admin|kinh doanh|business development|\bbd\b|account executive|telesales|bán hàng|trợ lý kinh doanh

Giáo viên/giảng dạy : giáo viên|giảng viên|teacher|tutor|lecturer|instructor|trợ giảng

Designer/thiết kế : designer|graphic|thiết kế|retoucher|art director|creative director|\bui/ux\b|\bux/ui\b|illustrator

Marketing/content : marketing|content|copywriter|seo specialist|\bseo\b|social media|truyền thông|thương hiệu

E-commerce/ops : e-commerce specialist|ecommerce specialist|thương mại điện tử|operations specialist|data entry|nhập liệu

HR/tuyển dụng : \bhr\b|human resource|recruit|tuyển dụng|nhân sự

Kế toán/tài chính : kế toán|accounting|accountant|kiểm toán|tài chính nội bộ

Hành chính/pháp lý : hành chính|administrative|\badmin assistant\b|legal|pháp lý|thư ký|receptionist|lễ tân

CSKH : customer service|chăm sóc khách hàng|\bcskh\b|call center|tổng đài

